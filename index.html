<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexicon Lottery - Host Master Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --navy: #001f3f; --gold: #D4AF37; --green: #27ae60; --red: #e74c3c; 
            --vowel-gold: #FFD700; --blue: #2980b9;
        }
        body, html {
            margin: 0; padding: 0; height: 100vh; width: 100vw;
            font-family: 'Segoe UI', sans-serif; background-color: var(--navy);
            color: white; overflow: hidden;
        }
        .screen { 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            width: 100%; 
            height: 100%; 
            position: relative;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .active { display: flex !important; }

        /* --- BACKGROUNDS --- */
        #home-screen { background-image: url('1stpagebg.png'); justify-content: center; padding-top: 10%; box-sizing: border-box; }
        #game-screen { background-image: url('2ndpagebg.png'); }

        /* --- SETTINGS PAGE --- */
        #settings-screen { font-family: 'Cambria', serif; background: var(--navy); }
        .settings-panel { 
            background: white; color: #333; padding: 30px; border-radius: 15px; 
            width: 90%; max-width: 900px; max-height: 85vh; overflow-y: auto; margin-top: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .file-management-header {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
        }

        .puzzle-block { background: #eee; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 10px solid var(--navy); position: relative; }
        .input-wrapper { position: relative; margin-bottom: 8px; }
        .input-wrapper input { 
            width: 100%; padding: 10px; text-transform: uppercase; border: 2px solid #ccc; 
            border-radius: 5px; font-family: 'Courier New', monospace; box-sizing: border-box; 
        }
        .char-count { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 0.8rem; color: #666; font-weight: bold; }

        /* --- UI CONTROLS --- */
        .top-left-tools { position: absolute; top: 15px; left: 15px; display: flex; gap: 10px; z-index: 100; }
        .tool-btn { width: 50px; height: 50px; border-radius: 50%; border: 2px solid white; background: rgba(0,0,0,0.4); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; transition: 0.2s; }
        .tool-btn:hover { background: rgba(255,255,255,0.2); }
        
        .bottom-left-tools { position: absolute; bottom: 15px; left: 15px; z-index: 100; }
        
        .bottom-right-tools { position: absolute; bottom: 15px; right: 15px; z-index: 100; display: flex; align-items: center; gap: 10px; }
        .solve-btn { padding: 10px 20px; background: var(--green); color: white; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 1rem; box-shadow: 0 4px 0px #1e8449; text-transform: uppercase; }
        .solve-btn:active { transform: translateY(2px); box-shadow: 0 2px 0px #1e8449; }
        
        .next-btn-icon { width: 50px; height: 50px; border-radius: 50%; border: 2px solid white; background: var(--gold); color: var(--navy); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 4px 0px #b8860b; }
        .next-btn-icon:active { transform: translateY(2px); box-shadow: 0 2px 0px #b8860b; }

        .wheel-ui-group { position: absolute; top: 15px; right: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 1000; }
        #wheel-toggle-btn { width: 55px; height: 55px; background: white; border: 4px solid var(--gold); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 28px; }
        #persistent-indicator { background: white; color: var(--navy); padding: 5px 15px; border-radius: 10px; font-weight: 900; border: 3px solid var(--gold); display: block; min-width: 60px; text-align: center; font-size: 1.2rem; }

        /* --- TEAM BOXES --- */
        #team-container { display: flex; gap: 10px; margin-bottom: 5px; width: 98%; justify-content: center; margin-top: 60px; }
        .team-box { background: rgba(255, 255, 255, 0.9); color: #333; padding: 8px; border-radius: 12px; border: 4px solid #ccc; text-align: center; flex: 1; max-width: 180px; transition: all 0.3s; position: relative; }
        .team-box.active-turn { border-color: var(--gold); border-width: 6px; transform: scale(1.08); box-shadow: 0 0 25px var(--gold); }
        .score-display { font-size: 1.8rem; font-weight: 900; display: block; margin: 2px 0; }
        .score-btns button { width: 35px; height: 35px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; font-size: 1.2rem; }

        /* --- CATEGORY HEADER --- */
        #category-strip { 
            background: var(--red); color: white; font-weight: 900; 
            padding: 8px 50px; border-radius: 5px; margin-bottom: 10px; 
            font-size: 1.4rem; box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            border-bottom: 3px solid #962d22; text-transform: uppercase; letter-spacing: 1px;
        }

        /* --- BOARD --- */
        #board-area { margin-top: 5px; }
        .board-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 6px; }
        .tile { width: 4.8vw; height: 7vh; max-width: 60px; max-height: 80px; border: 3px solid #000; border-radius: 5px; background: white; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; font-weight: 900; }
        
        .tile-unused { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.2); opacity: 1; }
        .tile-hidden { color: transparent; }
        .tile-revealed { color: black; animation: reveal 0.4s ease-out; }
        @keyframes reveal { from { transform: rotateY(90deg); } to { transform: rotateY(0); } }

        .tile-win { animation: goldFlash 0.6s infinite alternate; border-color: white !important; }
        @keyframes goldFlash { from { background: white; } to { background: var(--vowel-gold); box-shadow: 0 0 15px var(--gold); } }

        /* --- OVERLAYS --- */
        #win-overlay { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: rgba(0, 31, 63, 0.9); z-index: 6000; 
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }
        #win-text { font-size: 4rem; font-weight: 900; color: var(--gold); text-shadow: 0 0 20px black; margin-bottom: 20px; }
        .bonus-badge { font-size: 2rem; color: #FFD700; font-weight: 900; margin-bottom: 20px; animation: pulse 1s infinite; }

        .flying-bonus {
            position: fixed; z-index: 9999; pointer-events: none;
            background: var(--gold); color: white; padding: 10px 20px;
            border-radius: 50px; font-weight: 900; font-size: 2rem;
            box-shadow: 0 0 20px var(--vowel-gold);
            transition: all 0.8s cubic-bezier(0.6, -0.28, 0.735, 0.045);
        }

        /* --- RANKING SCREEN --- */
        #ranking-screen { background: var(--navy); color: white; }
        .ranking-container { background: white; color: var(--navy); padding: 40px; border-radius: 20px; width: 80%; max-width: 600px; text-align: center; }
        .rank-item { display: flex; justify-content: space-between; padding: 15px; border-bottom: 2px solid #eee; font-size: 1.5rem; font-weight: bold; }
        .rank-1 { background: gold; border-radius: 10px; color: black; }

        /* --- WHEEL MODAL --- */
        #wheel-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 2000; display: none; align-items: center; justify-content: center; }
        #wheel-canvas { cursor: pointer; border: 8px solid white; border-radius: 50%; }
        #wheel-pointer { position:absolute; top:20%; left:50%; transform:translateX(-50%); width:0; height:0; border-left:25px solid transparent; border-right:25px solid transparent; border-top:50px solid var(--red); z-index:2100; }
        #result-container { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-left: 40px; }
        #wheel-result-side { background: white; color: var(--navy); padding: 20px 40px; border-radius: 20px; font-weight: 900; font-size: 5rem; border: 8px solid var(--gold); display: none; }

        /* --- KEYBOARD --- */
        .keyboard-hub { margin-top: 15px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .key { width: 45px; height: 52px; background: white; color: #333; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 6px; font-weight: 900; font-size: 1.8rem; box-shadow: 0 4px 0px #aaa; }
        .key.vowel { background: var(--vowel-gold); border: 2px solid #b8860b; color: black; }
        .key.used { opacity: 0.2; pointer-events: none; background: #ddd; }
        #confirm-box { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); width: 220px; height: 220px; background: white; border: 10px solid #333; border-radius: 25px; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5000; }
        
        .score-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 4000; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 15px; }
        .score-modal-btn { width: 280px; padding: 20px; font-size: 1.4rem; font-weight: bold; border: none; border-radius: 15px; cursor: pointer; color: white; }
        .btn-close-modal { background: #555; margin-top: 15px; width: 150px; padding: 10px; }

        /* --- LOAD MODAL --- */
        #load-modal { z-index: 7000; }
        .file-list-item { 
            width: 100%; padding: 15px; margin-bottom: 10px; 
            background: #eee; border: none; border-radius: 10px; 
            cursor: pointer; font-weight: bold; font-size: 1.1rem;
            display: flex; justify-content: space-between;
        }
        .file-list-item:hover { background: #ddd; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <!-- WIN OVERLAY -->
    <div id="win-overlay">
        <div id="win-text">TEAM 1 WINS!</div>
        <div class="bonus-badge">+3,000 BONUS!</div>
        <button class="next-btn-icon" style="width: auto; padding: 0 30px; border-radius: 30px;" onclick="handleNextWithBonus()">NEXT PUZZLE</button>
    </div>

    <!-- RANKING SCREEN -->
    <div id="ranking-screen" class="screen">
        <h1 style="font-size: 4rem; color: var(--gold);">FINAL STANDINGS</h1>
        <div id="ranking-list" class="ranking-container"></div>
        <button onclick="location.reload()" style="margin-top: 30px; padding: 15px 40px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold;">MAIN MENU</button>
    </div>

    <!-- LOAD FILE MODAL -->
    <div id="load-modal" class="score-overlay">
        <div class="settings-panel" style="width: 400px;">
            <h2 style="margin-top:0;">Select Saved Puzzle</h2>
            <div id="saved-files-container" style="max-height: 300px; overflow-y: auto;"></div>
            <button class="score-modal-btn btn-close-modal" onclick="closeModals()" style="width:100%;">CANCEL</button>
        </div>
    </div>

    <!-- OTHER MODALS -->
    <div id="plus-modal" class="score-overlay">
        <h2 id="plus-title">ADD POINTS</h2>
        <button id="add-value-btn" class="score-modal-btn" style="background: var(--green);"></button>
        <button class="score-modal-btn btn-close-modal" onclick="closeModals()">CLOSE</button>
    </div>

    <div id="minus-modal" class="score-overlay">
        <h2 id="minus-title">DEDUCTIONS</h2>
        <button id="minus-value-btn" class="score-modal-btn" style="background: #d35400;" onclick="applyPenalty('WHEEL')"></button>
        <button class="score-modal-btn" style="background: var(--red);" onclick="applyPenalty('BANKRUPT')">BANKRUPT (0)</button>
        <button class="score-modal-btn" style="background: var(--gold); color: black;" onclick="applyPenalty('VOWEL')">BUY VOWEL (-1000)</button>
        <button class="score-modal-btn btn-close-modal" onclick="closeModals()">CLOSE</button>
    </div>

    <!-- HOME SCREEN -->
    <div id="home-screen" class="screen active">
        <button onclick="startGame()" style="padding:15px 60px; font-size:2.2rem; border-radius:50px; background:var(--green); color:white; border:none; cursor:pointer; margin-top:30px; font-weight: bold;">START GAME</button>
        <button onclick="showScreen('settings-screen')" style="background:white; color:var(--navy); padding:10px 30px; border-radius:30px; border:none; margin-top:20px; cursor:pointer; font-weight:bold;">⚙️ TEACHER SETTING</button>
    </div>

    <!-- SETTINGS SCREEN -->
    <div id="settings-screen" class="screen">
        <div class="settings-panel">
            <h2 style="color: var(--navy); border-bottom: 2px solid #ddd; padding-bottom: 10px;">Teacher Controls</h2>
            
            <div class="file-management-header">
                <div style="margin-bottom: 15px;">
                    <label style="font-weight: bold;">Class/File Name:</label>
                    <input type="text" id="current-file-name" placeholder="E.G. GRADE 10 - SECTION A" style="width: 100%; padding: 10px; margin-top: 5px; border: 2px solid var(--navy); border-radius: 5px; text-transform: uppercase;">
                </div>
                <div style="font-size: 1.1rem;">
                    <label>Number of Teams:</label>
                    <select id="team-count-select" style="font-size: 1.1rem; padding: 5px;">
                        <option value="2">2</option><option value="3" selected>3</option>
                        <option value="4">4</option><option value="5">5</option>
                    </select>
                </div>
            </div>

            <div id="puzzles-list"></div>
            <button onclick="addPuzzleBlock()" style="width:100%; padding:12px; margin-bottom:20px; cursor:pointer; font-size: 1rem;">+ ADD PUZZLE</button>
            
            <div style="display: flex; gap: 10px;">
                <button id="load-btn" onclick="openLoadMenu()" style="flex: 1; background:var(--blue); color:white; padding:15px; font-weight:bold; border:none; border-radius:5px; cursor: pointer; font-size: 1.2rem;">📂 LOAD</button>
                <button id="save-btn" onclick="saveAndReturn()" style="flex: 1; background:var(--green); color:white; padding:15px; font-weight:bold; border:none; border-radius:5px; cursor: pointer; font-size: 1.2rem;">💾 SAVE & APPLY</button>
                <button onclick="wipeLocalStorage()" style="flex: 1; background:var(--red); color:white; padding:15px; font-weight:bold; border:none; border-radius:5px; cursor: pointer; font-size: 1.2rem;">🗑️ WIPE DATA</button>
            </div>
            <p style="text-align: center; color: #666; font-size: 0.8rem; margin-top: 10px;">*Naming the file is required before saving.</p>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen">
        <div class="top-left-tools">
            <button class="tool-btn" onclick="showScreen('settings-screen')">⚙️</button>
            <button class="tool-btn" onclick="toggleMusic()">🎵</button>
            <button class="tool-btn" onclick="toggleFS()">📺</button>
        </div>
        <div class="bottom-left-tools">
            <button class="tool-btn" onclick="resetFullGame()">🔄</button>
        </div>
        
        <div class="bottom-right-tools">
            <button class="solve-btn" onclick="solvePuzzle()">SOLVE PUZZLE</button>
            <button id="main-next-btn" class="next-btn-icon" onclick="handleNextWithBonus()" title="Next Puzzle">⏭️</button>
        </div>

        <div class="wheel-ui-group">
            <div id="wheel-toggle-btn" onclick="openWheel()">🎡</div>
            <div id="persistent-indicator">0</div>
        </div>
        <div id="team-container"></div>
        
        <div id="category-strip">CATEGORY</div>

        <div id="board-area">
            <div id="br-1" class="board-row"></div><div id="br-2" class="board-row"></div>
            <div id="br-3" class="board-row"></div><div id="br-4" class="board-row"></div>
        </div>
        <div class="keyboard-hub"><div id="consonants-row" style="display:flex; gap:6px; margin-bottom:8px;"></div><div id="vowels-row" style="display:flex; gap:6px;"></div></div>
        <div id="confirm-box"><div id="preview-char" style="font-size:130px; font-weight:900; color:#333;">?</div></div>
    </div>

    <!-- WHEEL OVERLAY -->
    <div id="wheel-overlay">
        <div id="wheel-pointer"></div>
        <canvas id="wheel-canvas" width="600" height="600" onclick="spinWheel()"></canvas>
        <div id="result-container">
            <div id="wheel-result-side">0</div>
            <button id="wheel-close-btn" onclick="closeWheel()" style="padding:15px 60px; background:var(--red); color:white; border:none; border-radius:10px; cursor:pointer; font-weight:bold; display:none; font-size: 1.2rem;">CLOSE</button>
        </div>
    </div>

<script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSfx(type) {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'tick') { 
                osc.frequency.value = 600; gain.gain.setValueAtTime(0.1, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); 
                osc.start(); osc.stop(audioCtx.currentTime + 0.1); 
            }
            else if (type === 'hit') { 
                osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime); 
                osc.start(); osc.stop(audioCtx.currentTime + 0.3); 
            }
            else if (type === 'miss') { 
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime); 
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5); 
            }
            else if (type === 'win') {
                const times = [0, 0.15, 0.3, 0.5];
                const freqs = [523.25, 659.25, 783.99, 1046.50];
                times.forEach((t, i) => {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.type = 'square'; o.frequency.value = freqs[i];
                    g.gain.setValueAtTime(0.1, audioCtx.currentTime + t);
                    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.4);
                    o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.4);
                });
            }
        }

        let gamePuzzles = []; let currentPuzzleIdx = 0; let teams = []; let currentTIdx = 0; 
        let pending = ""; let isSpinning = false; let wheelRotation = 0; 
        let usedLetters = new Set(); let currentWheelValue = 0; let activeScoreTeam = null;
        let spinCount = 0; let isWaitingForWinConfirm = false;

        const wheelValues = ["500", "900", "BANKRUPT", "700", "600", "650", "500", "LOSE TURN", "800", "550", "600", "700", "FREE PLAY", "650", "500", "900", "BANKRUPT", "600", "700", "800", "650", "500", "550", "2 TURNS"];
        const wheelColors = ["#F4D03F", "#3498DB", "#000000", "#E67E22", "#2ECC71", "#AF7AC5", "#F4D03F", "#FFFFFF", "#E74C3C", "#58D68D", "#2ECC71", "#E67E22", "#5DADE2", "#AF7AC5", "#F4D03F", "#3498DB", "#000000", "#2ECC71", "#E67E22", "#E74C3C", "#AF7AC5", "#F4D03F", "#58D68D", "#F1C40F"];

        // --- FILE MANAGEMENT LOGIC ---
        function openLoadMenu() {
            const container = document.getElementById('saved-files-container');
            container.innerHTML = "";
            const keys = Object.keys(localStorage).filter(k => k.startsWith('lex_file_'));
            
            if(keys.length === 0) {
                container.innerHTML = "<p style='text-align:center'>No saved files found.</p>";
            } else {
                keys.forEach(k => {
                    const fileName = k.replace('lex_file_', '');
                    const btn = document.createElement('button');
                    btn.className = 'file-list-item';
                    btn.innerHTML = `<span>${fileName}</span> <span style="color:var(--red)" onclick="deleteFile(event, '${k}')">DEL</span>`;
                    btn.onclick = () => loadFile(fileName);
                    container.appendChild(btn);
                });
            }
            document.getElementById('load-modal').style.display = 'flex';
        }

        function loadFile(name) {
            const data = JSON.parse(localStorage.getItem('lex_file_' + name));
            gamePuzzles = data.puzzles;
            document.getElementById('team-count-select').value = data.teamCount;
            document.getElementById('current-file-name').value = name;
            closeModals();
            showScreen('settings-screen');
        }

        function deleteFile(e, key) {
            e.stopPropagation();
            if(confirm("Delete this file?")) {
                localStorage.removeItem(key);
                openLoadMenu();
            }
        }

        function saveAndReturn() {
            const fileName = document.getElementById('current-file-name').value.trim().toUpperCase();
            if(!fileName) { alert("Please enter a Class/File Name first!"); return; }

            const count = parseInt(document.getElementById('team-count-select').value);
            const puzzles = Array.from(document.querySelectorAll('.puzzle-block')).map(b => {
                const ins = b.querySelectorAll('input');
                return { cat: ins[0].value.toUpperCase(), r1: ins[1].value.toUpperCase(), r2: ins[2].value.toUpperCase(), r3: ins[3].value.toUpperCase(), r4: ins[4].value.toUpperCase() };
            }).filter(p => p.r1 || p.r2 || p.r3 || p.r4);

            if(puzzles.length === 0) { alert("Add at least one puzzle!"); return; }

            // Save to the library
            const fileData = { teamCount: count, puzzles: puzzles };
            localStorage.setItem('lex_file_' + fileName, JSON.stringify(fileData));
            
            // Set as active session
            gamePuzzles = puzzles;
            if(teams.length !== count) teams = Array.from({length: count}, (_, i) => ({score: 0, name: `TEAM ${i+1}`}));
            
            if (document.getElementById('team-container').innerHTML !== "") { initTeamUI(); loadPuzzle(true); showScreen('game-screen'); } 
            else { showScreen('home-screen'); }
        }

        function wipeLocalStorage() { 
            if(confirm("Permanently delete ALL saved files and puzzles?")) { 
                Object.keys(localStorage).forEach(k => { if(k.startsWith('lex_file_')) localStorage.removeItem(k); });
                location.reload(); 
            } 
        }

        // --- CORE GAME ENGINE ---
        function renameTeam(idx) {
            const newName = prompt("Enter new team name:", teams[idx].name);
            if (newName) { teams[idx].name = newName.toUpperCase(); initTeamUI(); }
        }

        function resetFullGame() {
            if(confirm("Reset scores and board?")) {
                teams.forEach((t, i) => { t.score = 0; t.name = `TEAM ${i+1}`; });
                usedLetters.clear(); currentTIdx = 0; currentWheelValue = 0; spinCount = 0; currentPuzzleIdx = 0;
                document.getElementById('persistent-indicator').innerText = "0";
                initTeamUI(); loadPuzzle(); showScreen('home-screen');
            }
        }

        function showRankings() {
            const listEl = document.getElementById('ranking-list'); listEl.innerHTML = "";
            const sorted = [...teams].sort((a,b) => b.score - a.score);
            sorted.forEach((team, idx) => {
                const item = document.createElement('div'); item.className = `rank-item ${idx === 0 ? 'rank-1' : ''}`;
                item.innerHTML = `<span>#${idx+1} ${team.name}</span><span>${team.score}</span>`;
                listEl.appendChild(item);
            });
            showScreen('ranking-screen'); confetti();
        }

        async function handleNextWithBonus() {
            const overlay = document.getElementById('win-overlay');
            if (overlay.style.display === 'flex') {
                const winnerBox = document.querySelectorAll('.team-box')[currentTIdx];
                const rect = winnerBox.getBoundingClientRect();
                const flyer = document.createElement('div');
                flyer.className = 'flying-bonus'; flyer.innerText = '+3000';
                flyer.style.left = '50%'; flyer.style.top = '50%'; flyer.style.transform = 'translate(-50%, -50%)';
                document.body.appendChild(flyer);
                overlay.style.display = 'none';
                setTimeout(() => {
                    flyer.style.left = (rect.left + rect.width/2) + 'px';
                    flyer.style.top = (rect.top + rect.height/2) + 'px';
                    flyer.style.transform = 'translate(-50%, -50%) scale(0.5)'; flyer.style.opacity = '0';
                }, 100);
                setTimeout(() => {
                    teams[currentTIdx].score += 3000;
                    flyer.remove(); playSfx('hit');
                    nextRound();
                }, 900);
            } else { nextRound(); }
        }

        function nextRound() {
            isWaitingForWinConfirm = false;
            if(currentPuzzleIdx + 1 < gamePuzzles.length) {
                currentPuzzleIdx++; 
                currentTIdx = (currentTIdx + 1) % teams.length;
                usedLetters.clear(); currentWheelValue = 0; spinCount = 0; 
                document.getElementById('persistent-indicator').innerText = "0";
                loadPuzzle(); initTeamUI();
            } else { showRankings(); }
        }

        function triggerWin() {
            confetti(); playSfx('win');
            document.querySelectorAll('.tile-revealed').forEach(t => t.classList.add('tile-win'));
            document.getElementById('win-text').innerText = `${teams[currentTIdx].name} SOLVED IT!`;
            const winBtn = document.querySelector('#win-overlay .next-btn-icon');
            if (currentPuzzleIdx + 1 >= gamePuzzles.length) { winBtn.innerText = "VIEW FINAL RANKING"; } 
            else { winBtn.innerText = "NEXT PUZZLE"; }
            document.getElementById('win-overlay').style.display = 'flex';
            isWaitingForWinConfirm = false;
        }

        async function solvePuzzle() {
            if(isSpinning) return;
            const hidden = Array.from(document.querySelectorAll('.tile-hidden'));
            if (hidden.length === 0) return;
            for (const tile of hidden) {
                tile.innerText = tile.dataset.l; tile.className = 'tile tile-revealed';
                playSfx('tick'); await new Promise(r => setTimeout(r, 100));
            }
            isWaitingForWinConfirm = true;
        }

        function drawWheel() { 
            const ctx = document.getElementById('wheel-canvas').getContext('2d'); const len = wheelValues.length;
            const arc = (Math.PI * 2) / len; ctx.clearRect(0,0,600,600); 
            wheelValues.forEach((v, i) => { 
                const angle = i * arc + wheelRotation; ctx.beginPath(); ctx.fillStyle = wheelColors[i]; ctx.moveTo(300,300); 
                ctx.arc(300,300,290, angle, angle + arc); ctx.fill(); ctx.save(); ctx.translate(300,300); ctx.rotate(angle + arc/2); 
                ctx.textAlign="right"; ctx.fillStyle = (wheelColors[i] === "#000000") ? "white" : (wheelColors[i] === "#FFFFFF") ? "black" : "white";
                ctx.font="900 18px Arial"; ctx.fillText(v, 280, 8); ctx.restore(); 
            }); 
        }

        function openWheel() { 
            document.getElementById('wheel-overlay').style.display='flex'; 
            document.getElementById('wheel-pointer').style.display='block'; 
            document.getElementById('wheel-result-side').style.display='none'; 
            document.getElementById('wheel-close-btn').style.display='none'; 
            drawWheel(); 
        }

        function closeWheel() { document.getElementById('wheel-overlay').style.display='none'; }

        function spinWheel() {
            if (isSpinning) return; isSpinning = true;
            const len = wheelValues.length; const targetIdx = Math.floor(Math.random() * len);
            const initialRot = wheelRotation;
            const finalRot = wheelRotation + (Math.PI * 2 * 10) + ((Math.PI * 2) - (targetIdx * (Math.PI*2/len)) - (Math.PI/len) - (Math.PI/2) - (wheelRotation % (Math.PI*2)));
            let start = null; let lastTick = 0;
            function animate(ts) {
                if(!start) start = ts; const t = Math.min((ts - start)/3000, 1);
                const ease = 1 - Math.pow(1-t, 3); wheelRotation = initialRot + (finalRot - initialRot) * ease;
                if(Math.abs(wheelRotation - lastTick) > (Math.PI*2/len)) { playSfx('tick'); lastTick = wheelRotation; }
                drawWheel();
                if(t < 1) requestAnimationFrame(animate);
                else { 
                    isSpinning = false; spinCount++;
                    document.getElementById('wheel-pointer').style.display = 'none';
                    const valStr = wheelValues[targetIdx]; const resSide = document.getElementById('wheel-result-side');
                    resSide.innerText = valStr; resSide.style.display = 'block';
                    document.getElementById('wheel-close-btn').style.display = 'block';
                    document.getElementById('persistent-indicator').innerText = valStr;
                    currentWheelValue = isNaN(valStr) ? 0 : parseInt(valStr);
                    if (spinCount > 1) { currentTIdx = (currentTIdx + 1) % teams.length; }
                    initTeamUI();
                }
            }
            requestAnimationFrame(animate);
        }

        function openPlus(idx) {
            activeScoreTeam = idx; document.getElementById('plus-title').innerText = `${teams[idx].name}: ADD POINTS`;
            const btn = document.getElementById('add-value-btn'); btn.innerText = `ADD ${currentWheelValue}`;
            btn.onclick = () => { teams[activeScoreTeam].score += currentWheelValue; initTeamUI(); };
            document.getElementById('plus-modal').style.display = 'flex';
        }

        function openMinus(idx) {
            activeScoreTeam = idx; document.getElementById('minus-title').innerText = `${teams[idx].name}: DEDUCTIONS`;
            const btn = document.getElementById('minus-value-btn'); btn.innerText = `DEDUCT ${currentWheelValue} (WHEEL)`;
            document.getElementById('minus-modal').style.display = 'flex';
        }

        function applyPenalty(type) {
            if (type === 'BANKRUPT') teams[activeScoreTeam].score = 0;
            if (type === 'VOWEL') teams[activeScoreTeam].score = Math.max(0, teams[activeScoreTeam].score - 1000);
            if (type === 'WHEEL') teams[activeScoreTeam].score = Math.max(0, teams[activeScoreTeam].score - currentWheelValue);
            initTeamUI();
        }

        function closeModals() { document.querySelectorAll('.score-overlay').forEach(m => m.style.display = 'none'); }
        function updChar(el, max) { el.parentElement.querySelector('.char-count').innerText = `${el.value.length}/${max}`; }

        function addPuzzleBlock(data = {cat: 'CATEGORY', r1:'', r2:'', r3:'', r4:''}) {
            const list = document.getElementById('puzzles-list'); const block = document.createElement('div'); block.className = 'puzzle-block';
            block.innerHTML = `
                <div class="input-wrapper"><input type="text" placeholder="Puzzle Category" value="${data.cat || 'CATEGORY'}" style="background:#fff9c4; font-weight:bold;"></div>
                <div class="input-wrapper"><input type="text" maxlength="12" placeholder="Row 1" value="${data.r1}" oninput="updChar(this, 12)"><span class="char-count">${data.r1.length}/12</span></div>
                <div class="input-wrapper"><input type="text" maxlength="14" placeholder="Row 2" value="${data.r2}" oninput="updChar(this, 14)"><span class="char-count">${data.r2.length}/14</span></div>
                <div class="input-wrapper"><input type="text" maxlength="14" placeholder="Row 3" value="${data.r3}" oninput="updChar(this, 14)"><span class="char-count">${data.r3.length}/14</span></div>
                <div class="input-wrapper"><input type="text" maxlength="12" placeholder="Row 4" value="${data.r4}" oninput="updChar(this, 12)"><span class="char-count">${data.r4.length}/12</span></div>
                <button onclick="this.parentElement.remove()" style="color:red; background:none; border:none; cursor:pointer; font-weight:bold;">[DELETE]</button>
            `;
            list.appendChild(block);
        }

        function startGame() { 
            if (gamePuzzles.length === 0) { alert("Please go to Settings and Load/Create a puzzle first!"); return; }
            if (teams.length === 0) { const count = parseInt(document.getElementById('team-count-select').value); teams = Array.from({length: count}, (_, i) => ({score: 0, name: `TEAM ${i+1}`})); }
            currentPuzzleIdx = 0; currentTIdx = 0; spinCount = 0; initTeamUI(); loadPuzzle(); showScreen('game-screen'); 
        }

        function initTeamUI() {
            const c = document.getElementById('team-container'); c.innerHTML = '';
            teams.forEach((t, i) => {
                const box = document.createElement('div'); box.className = `team-box ${i === currentTIdx ? 'active-turn' : ''}`;
                box.innerHTML = `<div onclick="renameTeam(${i})" style="cursor:pointer" title="Click to rename">${t.name} ✏️</div><span class="score-display">${t.score}</span><div class="score-btns"><button style="background:var(--green)" onclick="openPlus(${i})">+</button><button style="background:var(--red)" onclick="openMinus(${i})">-</button></div>`;
                c.appendChild(box);
            });
        }

        function loadPuzzle(isResume = false) {
            if(!gamePuzzles[currentPuzzleIdx]) return;
            const p = gamePuzzles[currentPuzzleIdx]; document.getElementById('category-strip').innerText = p.cat || "CATEGORY";
            const rows = [p.r1, p.r2, p.r3, p.r4]; const counts = [12, 14, 14, 12];
            rows.forEach((text, i) => {
                const el = document.getElementById(`br-${i+1}`); el.innerHTML = '';
                const pad = Math.floor((counts[i] - text.length) / 2);
                for(let j=0; j<counts[i]; j++) {
                    const tile = document.createElement('div'); tile.className = 'tile';
                    const char = (j >= pad && j < pad + text.length) ? text[j - pad] : "";
                    if(!char || char === " ") tile.classList.add('tile-unused'); 
                    else { tile.dataset.l = char; if(isResume && usedLetters.has(char)) { tile.innerText = char; tile.classList.add('tile-revealed'); } else { tile.classList.add('tile-hidden'); } }
                    el.appendChild(tile);
                }
            });
            buildKeys();
        }

        function buildKeys() {
            const cr = document.getElementById('consonants-row'); const vr = document.getElementById('vowels-row');
            cr.innerHTML = ''; vr.innerHTML = '';
            "BCDFGHJKLMNPQRSTVWXYZ".split('').forEach(l => { 
                const k = document.createElement('div'); k.className='key' + (usedLetters.has(l) ? ' used' : ''); 
                k.id='key-'+l; k.innerText=l; k.onclick=()=>pick(l); cr.appendChild(k); 
            });
            "AEIOU".split('').forEach(l => { 
                const k = document.createElement('div'); k.className='key vowel' + (usedLetters.has(l) ? ' used' : ''); 
                k.id='key-'+l; k.innerText=l; k.onclick=()=>pick(l); vr.appendChild(k); 
            });
        }

        function pick(l) { if(usedLetters.has(l)) return; pending = l; document.getElementById('confirm-box').style.display='flex'; document.getElementById('preview-char').innerText=l; }

        window.onkeydown = (e) => {
            const key = e.key.toUpperCase();
            if (e.key === "Enter") {
                if (isWaitingForWinConfirm) { triggerWin(); return; }
                if (pending) {
                    e.preventDefault(); let found = false;
                    document.querySelectorAll('.tile-hidden').forEach(t => { if(t.dataset.l === pending) { t.innerText = pending; t.className = 'tile tile-revealed'; found = true; playSfx('hit'); } });
                    if (!found) playSfx('miss');
                    document.getElementById('confirm-box').style.display='none'; usedLetters.add(pending);
                    const visualKey = document.getElementById('key-' + pending); if(visualKey) visualKey.classList.add('used');
                    pending = ""; if(document.querySelectorAll('.tile-hidden').length === 0) { isWaitingForWinConfirm = true; }
                    return;
                }
            }
            if (document.getElementById('game-screen').classList.contains('active') && key.length === 1 && key >= 'A' && key <= 'Z' && !usedLetters.has(key) && document.activeElement.tagName !== 'INPUT') { pick(key); }
        };

        function toggleMusic() { const m = document.getElementById('bgMusic'); m.paused ? m.play() : m.pause(); }
        function toggleFS() { if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
        
        function showScreen(id) { 
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); 
            document.getElementById(id).classList.add('active'); 
            if(id === 'settings-screen') { 
                const list = document.getElementById('puzzles-list'); 
                list.innerHTML = ''; 
                if(gamePuzzles.length > 0) gamePuzzles.forEach(p => addPuzzleBlock(p)); 
                else addPuzzleBlock(); 
            } 
        }
        
        window.onload = () => { 
            // Optional: Auto-load the last used file if needed
        };
    </script>
</body>
</html>
